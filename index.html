<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🅿️ Nantes 🏍️</title>
    <link rel="stylesheet" href="style.css"/>
    <script type="module" src="main.js" defer></script>
</head>
<body>
    <header>
        <h1>🅿️ Stationnement motos & 2 roues motorisés 🏍</h1>
        <h2>NANTES HYPERCENTRE</h2>
    </header>
    
    <main>
        <nav id="nav">
            <button type="button" id="centre">🏰 Centre ville</button>
            <button type="button" id="hpsf">🏢 Hauts Pavés - Saint Félix</button>
            <button type="button" id="ile">🐘 Île de Nantes</button>
        </nav>
        <div id="total-results">
            <p>Nombre de résultats : 0</p>
        </div>
        <div class="recherche-places">
            <label for="recherche-places">
                Rechercher par nombre de places
            </label>
            <input
            type="search"
            id="recherche-places"
            placeholder="Ex. : 12"
            autocomplete="off"
        >
        </div>
        <section class="results">
            <!-- les cartes seront générées par javascript -->
        </section>
        <section class="focus cache">
            <article class="carte cache">
                <!-- Mini-carte OpenStreetMap -->
                <div class="conteneur-mini-carte-focus"></div>
                <h3>Nantes</h3>
                <ul>
                    <li class="quartier">Centre ville</li>
                    <li class="nbPlaces">X places</li>
                    </ul>
                <p class="adresse">Adresse en cours de recherche...</p>
                <p class="adresse"></p>
                <small class="attribution">
                    Données cartographiques ©
                    <a href="https://www.openstreetmap.org/copyright"
                    target="_blank"
                    rel="noopener noreferrer">
                    OpenStreetMap contributors
                    </a>
                </small>
                <p><b>Coordonnées GPS</b></p>
                <ul class="gps">
                    <li class="lat">latitude</li>
                    <li class="lon">longitude</li>
                </ul>
            </article>
            <button type="button" id="btn-retour">Retour</button>
        </section>

        <nav id="pages">
            <button type="button" id="btn-precedente">⬅️ Précédente</button>
            <button type="button" id="btn-suivante">Suivante ➡️</button>
        </nav>
    </main>

    <footer>
        <p>© YE 2026</p>
    </footer>
</body>
</html>
